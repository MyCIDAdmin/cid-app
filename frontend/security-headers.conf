# Sicherheits-Header (2026-10-07, Sicherheitsprüfung). Wird in jeder location per `include`
# eingebunden, weil ein `add_header` innerhalb einer location die Header des server-Blocks
# verdrängt.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
# CSP wird erzwungen (seit 2026-10-08; zuvor Report-Only). Bei Problemen schnell zurückstellen:
# `Content-Security-Policy` -> `Content-Security-Policy-Report-Only` (blockiert dann nichts mehr).
# connect-src: API und WebSocket liegen auf dem Railway-Standardhost bzw. einer Subdomain der
# eigenen Domains (my-cid.de, mycid.org) — beim Wechsel auf eine neue Domain hier ergänzen.
# img-src/media-src erlauben https: allgemein (Bilder/Videos kommen aus MinIO bzw. eigenen Domains);
# der eigentliche Schutz ist script-src 'self' (kein Inline-/Fremd-Skript, kein javascript:-Link).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://*.my-cid.de wss://*.my-cid.de https://mycid.org https://*.mycid.org wss://*.mycid.org https://*.up.railway.app wss://*.up.railway.app; frame-src https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

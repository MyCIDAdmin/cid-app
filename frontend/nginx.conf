# Config nginx pour servir la SPA React buildée (utilisée par Dockerfile.prod)
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fichiers de traduction i18next (public/locales/<lng>/<ns>.json) — contrairement à
    # /assets/, ces URLs ne sont PAS hashées par Vite (toujours le même chemin d'un déploiement
    # à l'autre, ex. /locales/de/communaute.json) : sans en-tête explicite ils héritent du
    # comportement de cache par défaut du navigateur/d'un éventuel CDN devant Railway, qui peut
    # continuer à servir une réponse mise en cache lors d'un déploiement précédent même après un
    # nouveau build — observé en test manuel Phase 4B (clés techniques comme "messagerie.titre"
    # affichées au lieu du texte traduit pour tous les namespaces ajoutés après le tout premier
    # déploiement). "no-cache" force une revalidation (ETag/Last-Modified) à chaque requête —
    # ces fichiers sont trop petits pour que ce soit un coût de performance notable, voir
    # CID-TDD-001 v1.2 §6.2 (stratégie de cache multicouche : TTL 1 an réservé aux assets Vite
    # hashés, jamais aux JSON de traduction).
    location /locales/ {
        add_header Cache-Control "no-cache";
    }
}

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint-test:
    name: Backend — Lint & Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-test-secret-key
      SECRET_FIELD_KEY: 8w6C9y2z1v5b8n3m6q9r2t5y8u1i4o7p0a3s6d9f2g5h8=
      DATABASE_URL: sqlite:///ci_test.db
      ALLOWED_HOSTS: localhost
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      EMAIL_HOST: localhost
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/dev.txt

      - name: Install system dependencies (WeasyPrint, python-magic)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libcairo2 libmagic1

      - name: Install Python dependencies
        run: pip install -r requirements/dev.txt

      - name: Lint — Black
        run: black --check apps config manage.py

      - name: Lint — isort
        run: isort --check-only apps config manage.py

      - name: Lint — flake8
        run: flake8 apps config manage.py

      - name: Security scan — bandit
        run: bandit -r apps config -x "*/tests/*,*/migrations/*" || true

      - name: Django system check
        run: python manage.py check

      - name: Run tests (pytest)
        run: python -m pytest --cov=apps --cov-report=xml

      - name: Audit dependencies — pip-audit
        run: |
          pip install --quiet pip-audit
          pip-audit -r requirements/prod.txt || true

  frontend-lint-test:
    name: Frontend — Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint — ESLint
        run: npm run lint

      - name: Type check & build
        run: npm run build

      - name: Tests (Vitest)
        run: npm test

      - name: Audit dependencies — npm audit
        run: npm audit --audit-level=high || true

  docker-build:
    name: Docker — Build images (validation)
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend-lint-test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (prod)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: false
          tags: cid-backend:ci

      - name: Build frontend image (prod)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: false
          tags: cid-frontend:ci

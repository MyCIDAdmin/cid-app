<!doctype html>
<html lang="{{ sprache }}" dir="{% if rtl %}rtl{% else %}ltr{% endif %}"><head><meta charset="utf-8">
<style>
@page { size: A4; margin: 18mm 16mm; }
body { font-family: "DejaVu Sans", Arial, sans-serif; color: #17181c; font-size: 11.5pt; line-height: 1.55; }
.kopf { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #d00a0f; padding-bottom: 10px; }
.logo { display: inline-block; width: 46px; height: 46px; line-height: 46px; text-align: center; background: #d00a0f; color: #fff; font-weight: bold; font-size: 15pt; border-radius: 9px; }
.name { font-weight: bold; font-size: 13pt; margin: 0 10px; }
.anschrift { font-size: 9pt; color: #4b5563; text-align: {% if rtl %}left{% else %}right{% endif %}; }
h1 { font-size: 18pt; margin: 24px 0 10px; }
.inhalt p { margin: 0 0 9pt; } .inhalt ul, .inhalt ol { margin: 0 0 9pt; }
.hinweis { margin-top: 16px; font-size: 9pt; color: #8a5a00; background: #fff4dc; padding: 4px 8px; display: inline-block; }
.fuss { position: fixed; bottom: 0; left: 0; right: 0; border-top: 1px solid #d6d9de; padding-top: 6px; text-align: center; font-size: 8.5pt; color: #6b7280; }
</style></head><body>
<table class="kopf" style="width:100%"><tr>
<td><span class="logo">CID</span> <span class="name">Clubistes in Deutschland e.V.</span></td>
<td class="anschrift">{% for z in anschrift %}{{ z }}<br>{% endfor %}</td></tr></table>
<h1>{{ betreff }}</h1>
<div class="inhalt">{{ inhalt|safe }}</div>
{% if maschinell %}<div class="hinweis">{{ mt_hinweis }} · {{ verbindlich }}</div>{% endif %}
<div class="fuss">Clubistes in Deutschland e.V.{% for z in anschrift %} · {{ z }}{% endfor %} · {{ datum|date:"d.m.Y" }}</div>
</body></html>

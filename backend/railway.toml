# Config Railway pour le service backend (Django API + ASGI).
# Root Directory du service Railway = "backend" ; Dockerfile Path = "Dockerfile.prod".
# Les services celery_worker et celery_beat réutilisent la même image, voir docs/RAILWAY.md.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.prod"

[deploy]
healthcheckPath = "/health/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
